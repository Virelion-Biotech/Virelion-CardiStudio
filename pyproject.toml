[project]
name = "virelion-cardistudio"
version = "0.2.0"
description = "Reproducible cardiac challenge-population studio"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "scipy>=1.11"]

[project.optional-dependencies]
analysis = ["pandas>=2.0", "plotly>=5.18"]
app = ["streamlit>=1.35", "plotly>=5.18"]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.5",
  "hypothesis>=6.100",
  "mypy>=1.10",
  "pre-commit>=3.7",
  "pandas>=2.0",
  "plotly>=5.18",
]

[project.scripts]
cardistudio = "cardistudio.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-q --strict-markers --cov=cardistudio --cov-report=term-missing --cov-fail-under=80"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
